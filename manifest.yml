modules:
  function:
    - key: index-run
      handler: index.run
    - key: trigger-handler
      handler: trigger.handler
  scheduledTrigger:
    - key: stale-issue-nudge-trigger
      function: index-run
      interval: hour  # Changed to 'hour' for testing - change back to 'day' later
  jira:globalPage:
    - key: stale-issue-global-page
      resource: admin-page
      resolver:
        function: trigger-handler
      title: Stale Issue Auto-Nudge
resources:
  - key: admin-page
    path: static/admin
app:
  runtime:
    name: nodejs20.x
  id: ari:cloud:ecosystem::app/89ee6a37-c321-4839-91c8-4eb9dadeca89
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
  external:
    fetch:
      backend:
        - address: "*.atlassian.net"
