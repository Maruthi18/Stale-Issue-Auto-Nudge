modules:
  function:
    - key: index-run
      handler: index.run
    - key: trigger-handler
      handler: trigger.handler
  scheduledTrigger:
    - key: stale-issue-nudge-trigger
      function: index-run
      interval: day  # Changed to 'hour' for testing - change back to 'day' later
  jira:globalPage:
    - key: stale-issue-global-page
      resource: admin-page
      resolver:
        function: trigger-handler
      title: Stale Issue Auto-Nudge
  jira:issuePanel:
    - key: stale-issue-panel
      resource: issue-panel
      resolver:
        function: trigger-handler
      title: Stale Issue Auto-Nudge
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
resources:
  - key: admin-page
    path: static/admin
  - key: issue-panel
    path: static/issue-panel
app:
  runtime:
    name: nodejs20.x
  id: ari:cloud:ecosystem::app/89ee6a37-c321-4839-91c8-4eb9dadeca89
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
  external:
    fetch:
      backend:
        - address: "*.atlassian.net"
        - address: "api.sendgrid.com"
